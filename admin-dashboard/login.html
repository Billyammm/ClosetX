<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClosetX Admin - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --closetx-ink: #26251f;
            --closetx-muted: #77766e;
            --closetx-paper: #f7f5f0;
            --closetx-line: #eae7df;
            --closetx-accent: #b46750;
        }

        body {
            background: var(--closetx-paper);
            color: var(--closetx-ink);
        }

        .orb {
            opacity: 0.12;
            filter: blur(110px);
        }

        .relative.z-10 {
            background: rgb(255 255 255 / 94%);
            border-color: var(--closetx-line);
            box-shadow: 0 24px 60px rgb(38 37 31 / 10%);
        }

        .text-gray-300,
        .text-gray-400,
        .text-gray-500 {
            color: var(--closetx-muted) !important;
        }

        .text-white {
            color: var(--closetx-ink) !important;
        }

        input {
            background: var(--closetx-paper) !important;
            border-color: var(--closetx-line) !important;
            color: var(--closetx-ink) !important;
        }

        input::placeholder {
            color: var(--closetx-muted);
        }

        #loginBtn {
            background: var(--closetx-accent);
        }

        #loginBtn,
        #resetBtn,
        #loginBtn .text-white,
        #resetBtn .text-white {
            color: #fff;
        }

        #resetBtn {
            background: var(--closetx-accent);
        }

        #forgotPasswordLink,
        #backToLoginBtn {
            color: var(--closetx-accent);
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.1); }
            50% { transform: translate(-20px, 20px) scale(0.9); }
            75% { transform: translate(40px, 10px) scale(1.05); }
        }
        
        .orb {
            animation: float 10s ease-in-out infinite;
            filter: blur(110px);
            opacity: 0.12;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .slide-up {
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .spinner {
            animation: spin 0.8s linear infinite;
        }

        @media (max-width: 480px) {
            .relative.z-10 {
                margin: 1rem;
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Animated Background Orbs -->
<div class="absolute w-96 h-96 bg-red-500 rounded-full orb -top-20 -left-20" style="animation-delay: 0s; background-color: #b46750;"></div>
<div class="absolute w-[500px] h-[500px] bg-blue-500 rounded-full orb -bottom-40 -right-40" style="animation-delay: 2s; background-color: #e6e9df;"></div>
<div class="absolute w-72 h-72 bg-cyan-500 rounded-full orb top-1/2 left-1/2" style="animation-delay: 4s; background-color: #b46750;"></div>

    <!-- Login Card -->
    <div class="relative z-10 rounded-3xl p-12 w-full max-w-md slide-up">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="text-6xl mb-4">✦</div>
            <h1 class="text-3xl font-bold mb-2 text-[#26251F]">
                ClosetX Admin
            </h1>
            <p class="text-gray-400 text-sm">Sign in to manage your platform</p>
        </div>

        <!-- Error Alert -->
        <div id="errorAlert" class="hidden mb-6 bg-red-500/10 border border-red-500/30 rounded-xl p-4 flex items-center gap-3">
            <span class="text-xl">⚠️</span>
            <span id="errorMessage" class="text-red-500 text-sm"></span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-5">
            <!-- Email -->
            <div>
                <label class="block text-gray-300 text-sm font-medium mb-2">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    required
                    placeholder="admin@closetx.com"
                    class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition"
                >
            </div>

            <!-- Password -->
            <div>
                <label class="block text-gray-300 text-sm font-medium mb-2">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    required
                    placeholder="Enter your password"
                    class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition"
                >
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                id="loginBtn"
                class="w-full bg-gradient-to-r from-red-500 to-cyan-500 text-white font-semibold py-3 rounded-xl hover:shadow-lg hover:shadow-cyan-500/30 transition transform hover:-translate-y-0.5 flex items-center justify-center gap-3"
            >
                <span id="loginBtnText">Sign In</span>
                <span id="loginSpinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full spinner"></span>
                <span id="loginArrow" class="text-xl">→</span>
            </button>
            <div class="flex flex-col gap-2 mt-2 text-sm text-cyan-300">
                <p class="text-right hover:underline cursor-pointer" id="forgotPasswordLink">Forgot password?</p>
            </div>
        </form>

        <!-- Reset Password Form -->
        <div id="resetSection" class="hidden space-y-5">
            <div class="text-center">
                <h2 class="text-2xl font-semibold mb-2 text-white">Reset Admin Password</h2>
                <p class="text-gray-400 text-sm">Enter your admin email to receive a password reset link.</p>
            </div>
            <form id="resetForm" class="space-y-5">
                <div>
                    <label class="block text-gray-300 text-sm font-medium mb-2">Admin Email</label>
                    <input
                        type="email"
                        id="resetEmail"
                        required
                        placeholder="admin@closetx.com"
                        class="w-full bg-gray-700 border border-gray-600 rounded-xl px-4 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 transition"
                    >
                </div>
                <button
                    type="submit"
                    id="resetBtn"
                    class="w-full bg-green-500 text-white font-semibold py-3 rounded-xl hover:shadow-lg hover:shadow-green-500/30 transition transform hover:-translate-y-0.5"
                >
                    <span id="resetBtnText">Send Reset Link</span>
                    <span id="resetSpinner" class="hidden w-4 h-4 border-2 border-white/30 border-t-white rounded-full spinner"></span>
                </button>
                <button
                    type="button"
                    id="backToLoginBtn"
                    class="w-full text-cyan-400 border border-cyan-500 rounded-xl py-3 hover:bg-cyan-500/10 transition"
                >
                    Back to sign in
                </button>
            </form>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6 pt-6 border-t border-gray-700">
            <p class="text-gray-500 text-xs">Secure admin access only</p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
